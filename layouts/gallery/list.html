{{ define "main" }}
<div class="gallery">
  <h1>{{ .Title }}</h1>
  <div class="gallery-grid">
    {{ range .Params.images }}
    <div class="gallery-item">
      <img src="{{ . }}" alt="{{ . }}" loading="lazy">
    </div>
    {{ end }}
  </div>
</div>

<style>
.gallery-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
  gap: 15px;
  margin-top: 20px;
}
.gallery-item img {
  width: 100%;
  height: 200px;
  object-fit: cover;
  border-radius: 8px;
  transition: transform 0.3s;
}
.gallery-item img:hover {
  transform: scale(1.05);
}
</style>
{{ end }}
